<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Print Shop</title>
  <link rel="stylesheet" href="/storefront/shop.css" />
</head>
<body>

<header>
  <div class="header-inner">
    <a class="shop-logo" href="/storefront/">🖨️ <span id="shop-name">3D Print Shop</span></a>
    <span class="header-sub">Custom 3D Prints · Fast Shipping</span>
  </div>
</header>

<section class="hero">
  <h1>Custom 3D Prints<br/>Made to Order</h1>
  <p>Browse our catalog and order directly. Printed fresh, shipped fast.</p>
</section>

<main class="main">
  <div class="products-section">
    <div class="section-title">Shop All Products</div>
    <div class="products-grid" id="products-grid">
      <div class="loading">Loading products…</div>
    </div>
  </div>
</main>

<footer>
  <p>© <span id="year"></span> <span class="shop-name-f">3D Print Shop</span> · All orders are 3D printed on demand · Ships in 3–7 business days</p>
</footer>

<script src="/storefront/shop.js"></script>
</body>
</html>
